name: Keep Streamlit App Alive

on:
  schedule:
    # سيتم تشغيل هذا الأمر تلقائيًا كل يومين (الساعة 12:00 مساءً بتوقيت جرينتش)
    - cron: '0 12 */2 * *'
  workflow_dispatch: # يتيح لك تشغيل الأمر يدويًا للتجربة

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-cache-dependency-path: true

      - name: Install Playwright (Virtual Browser)
        run: |
          pip install playwright
          playwright install chromium

      - name: Simulate Real Visit to Streamlit
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              # فتح متصفح كروم خفي
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print('Visiting Streamlit App...')
              # اذهب إلى رابط تطبيقك
              page.goto('https://finance-analyse2026.streamlit.app', wait_until='networkidle')
              
              # الانتظار لمدة 15 ثانية للتأكد من تحميل الـ WebSockets بالكامل
              time.sleep(15)
              
              print('App successfully pinged and kept alive!')
              browser.close()
          "
