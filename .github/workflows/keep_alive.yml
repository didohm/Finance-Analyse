name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install Playwright (Virtual Browser)
        run: |
          pip install playwright
          playwright install chromium

      - name: Simulate Real Visit to Streamlit
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://finance-analyse2026.streamlit.app', wait_until='networkidle')
              time.sleep(15)
              browser.close()
          "
